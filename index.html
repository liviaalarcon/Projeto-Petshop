<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <title>Jogo da Memória 💖</title>

<body>

    <main class="game">

        <h1>🧠 Jogo da Memória</h1>

        <p class="subtitle">
            Encontre todos os pares! 💕
        </p>

        <div class="info">

            <div class="info-box">
                ⭐ Pontos
                <strong id="score">0</strong>
            </div>

            <div class="info-box">
                🎯 Tentativas
                <strong id="attempts">0</strong>
            </div>

            <div class="info-box">
                ⏱️ Tempo
                <strong id="time">60</strong>
            </div>

        </div>

        <div
            id="board"
            class="board"
        ></div>

        <button
            id="restart"
            class="restart"
        >
            🔄 Jogar novamente
        </button>

    </main>


    <!-- TELA DE RESULTADO -->

    <div
        id="overlay"
        class="overlay hidden"
    >

        <div class="result-box">

            <div
                id="resultEmoji"
                class="emoji"
            >
                🏆
            </div>

            <h2 id="resultTitle">
                Parabéns!
            </h2>

            <p id="resultMessage">
                Você encontrou todos os pares!
            </p>

            <div class="result-info">
                ⭐ Pontos:
                <strong id="finalScore">0</strong>
            </div>

            <div class="result-info">
                🎯 Tentativas:
                <strong id="finalAttempts">0</strong>
            </div>

            <div class="result-info">
                ⏱️ Tempo:
                <strong id="finalTime">0</strong>s
            </div>

            <button
                id="playAgain"
                class="play-again"
            >
                🎀 Jogar novamente
            </button>

        </div>

    </div>


    <script>

        // =====================================
        // ELEMENTOS
        // =====================================

        const board =
            document.getElementById("board");

        const scoreElement =
            document.getElementById("score");

        const attemptsElement =
            document.getElementById("attempts");

        const timeElement =
            document.getElementById("time");

        const restartButton =
            document.getElementById("restart");

        const playAgainButton =
            document.getElementById("playAgain");

        const overlay =
            document.getElementById("overlay");

        const resultTitle =
            document.getElementById("resultTitle");

        const resultMessage =
            document.getElementById("resultMessage");

        const resultEmoji =
            document.getElementById("resultEmoji");

        const finalScore =
            document.getElementById("finalScore");

        const finalAttempts =
            document.getElementById("finalAttempts");

        const finalTime =
            document.getElementById("finalTime");


        // =====================================
        // EMOJIS
        // =====================================

        const symbols = [
            "🐱",
            "🐶",
            "🐰",
            "🦄",
            "🍓",
            "🧁",
            "🌸",
            "💎"
        ];


        // =====================================
        // VARIÁVEIS
        // =====================================

        let firstCard = null;

        let secondCard = null;

        let lockBoard = false;

        let matches = 0;

        let score = 0;

        let attempts = 0;

        let time = 60;

        let timer = null;


        // =====================================
        // EMBARALHAR
        // =====================================

        function shuffle(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] = [
                    array[j],
                    array[i]
                ];
            }

        }


        // =====================================
        // COMEÇAR JOGO
        // =====================================

        function startGame() {

            clearInterval(timer);

            firstCard = null;
            secondCard = null;

            lockBoard = false;

            matches = 0;
            score = 0;
            attempts = 0;
            time = 60;

            updateInfo();

            overlay.classList.add("hidden");

            board.innerHTML = "";


            // Criar pares

            let cards = [
                ...symbols,
                ...symbols
            ];


            // Embaralhar

            shuffle(cards);


            // Criar cartas

            cards.forEach(
                symbol => {

                    createCard(symbol);

                }
            );


            // Começar cronômetro

            startTimer();

        }


        // =====================================
        // CRIAR CARTA
        // =====================================

        function createCard(symbol) {

            const card =
                document.createElement("button");

            card.className = "card";

            card.dataset.symbol = symbol;


            card.innerHTML = `
                <div class="card-inner">

                    <div class="card-back"></div>

                    <div class="card-front">
                        ${symbol}
                    </div>

                </div>
            `;


            card.addEventListener(
                "click",
                () => flipCard(card)
            );


            board.appendChild(card);

        }


        // =====================================
        // VIRAR CARTA
        // =====================================

        function flipCard(card) {

            if (lockBoard) {
                return;
            }


            if (card === firstCard) {
                return;
            }


            if (card.classList.contains("matched")) {
                return;
            }


            card.classList.add("flipped");


            if (firstCard === null) {

                firstCard = card;

                return;
            }


            secondCard = card;

            attempts++;

            updateInfo();

            checkCards();

        }


        // =====================================
        // VERIFICAR CARTAS
        // =====================================

        function checkCards() {

            const match =
                firstCard.dataset.symbol ===
                secondCard.dataset.symbol;


            if (match) {

                correctPair();

            } else {

                wrongPair();

            }

        }


        // =====================================
        // PAR CORRETO
        // =====================================

        function correctPair() {

            firstCard.classList.add("matched");

            secondCard.classList.add("matched");


            matches++;

            score += 100;


            updateInfo();


            resetCards();


            // Todos os pares encontrados?

            if (
                matches === symbols.length
            ) {

                winGame();

            }

        }


        // =====================================
        // PAR ERRADO
        // =====================================

        function wrongPair() {

            lockBoard = true;


            setTimeout(
                () => {

                    firstCard.classList.remove(
                        "flipped"
                    );

                    secondCard.classList.remove(
                        "flipped"
                    );


                    resetCards();

                },
                800
            );

        }


        // =====================================
        // RESETAR
        // =====================================

        function resetCards() {

            firstCard = null;

            secondCard = null;

            lockBoard = false;

        }


        // =====================================
        // CRONÔMETRO
        // =====================================

        function startTimer() {

            timer =
                setInterval(
                    () => {

                        time--;

                        updateInfo();


                        if (time <= 0) {

                            clearInterval(timer);

                            loseGame();

                        }

                    },
                    1000
                );

        }


        // =====================================
        // VITÓRIA
        // =====================================

        function winGame() {

            clearInterval(timer);

            // Bônus pelo tempo

            score += time * 5;

            updateInfo();


            resultEmoji.textContent = "🏆";

            resultTitle.textContent =
                "Parabéns! 💖";

            resultMessage.textContent =
                "Você encontrou todos os pares!";


            finalScore.textContent =
                score;

            finalAttempts.textContent =
                attempts;

            finalTime.textContent =
                60 - time;


            overlay.classList.remove(
                "hidden"
            );

        }


        // =====================================
        // PERDEU
        // =====================================

        function loseGame() {

            lockBoard = true;


            resultEmoji.textContent = "⏰";

            resultTitle.textContent =
                "Tempo acabou!";

            resultMessage.textContent =
                "Tente novamente! Você consegue! 💕";


            finalScore.textContent =
                score;

            finalAttempts.textContent =
                attempts;

            finalTime.textContent =
                60;


            overlay.classList.remove(
                "hidden"
            );

        }


        // =====================================
        // ATUALIZAR INFORMAÇÕES
        // =====================================

        function updateInfo() {

            scoreElement.textContent =
                score;

            attemptsElement.textContent =
                attempts;

            timeElement.textContent =
                time;

        }


        // =====================================
        // BOTÕES
        // =====================================

        restartButton.addEventListener(
            "click",
            startGame
        );

        playAgainButton.addEventListener(
            "click",
            startGame
        );


        // =====================================
        // INICIAR
        // =====================================

        startGame();

    </script>

</body>
</html>
