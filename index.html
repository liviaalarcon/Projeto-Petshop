<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Memória 💖</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #ffd6eb,
                #e4d5ff
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            color: #704f64;
        }

        .game {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        h1 {
            color: #e95b9f;
            font-size: clamp(30px, 7vw, 48px);
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8d7183;
            margin-bottom: 25px;
            font-size: 17px;
        }

        /* INFORMAÇÕES */

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .info-box {
            background: white;
            border-radius: 18px;
            padding: 12px 5px;

            box-shadow:
                0 6px 15px rgba(100, 50, 100, 0.12);

            font-size: 14px;
        }

        .info-box strong {
            display: block;
            color: #e95b9f;
            font-size: 22px;
            margin-top: 4px;
        }

        /* TABULEIRO */

        .board {
            width: 100%;
            max-width: 560px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 10px;
        }

        /* CARTA */

        .card {
            width: 100%;
            aspect-ratio: 1;

            border: 0;
            padding: 0;

            background: transparent;

            cursor: pointer;

            perspective: 700px;
        }

        .card-inner {
            width: 100%;
            height: 100%;

            position: relative;

            transition: transform 0.5s;

            transform-style: preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;

            width: 100%;
            height: 100%;

            border-radius: 16px;

            display: flex;
            justify-content: center;
            align-items: center;

            backface-visibility: hidden;

            box-shadow:
                0 5px 12px rgba(100, 50, 100, 0.15);
        }

        /* FRENTE FECHADO */

        .card-back {
            background: linear-gradient(
                135deg,
                #ff70b2,
                #b78aff
            );

            color: white;

            font-size: 32px;
        }

        .card-back::after {
            content: "💖";
        }

        /* PAR ABERTO */

        .card-front {
            background: white;

            transform: rotateY(180deg);

            font-size: clamp(30px, 8vw, 50px);

            border: 3px solid #ffd0e5;
        }

        .card.matched .card-front {
            background: #fff0f8;
            border-color: #ff78b4;

            box-shadow:
                0 0 18px rgba(255, 100, 180, 0.4);
        }

        /* BOTÃO */

        .restart {
            margin-top: 25px;

            border: none;

            padding: 14px 25px;

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                #ff70b2,
                #b78aff
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 15px rgba(180, 100, 170, 0.25);

            transition: 0.2s;
        }

        .restart:hover {
            transform: translateY(-3px);
        }

        /* TELA FINAL */

        .overlay {
            position: fixed;

            inset: 0;

            background: rgba(60, 35, 60, 0.55);

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            z-index: 100;
        }

        .overlay.hidden {
            display: none;
        }

        .result-box {
            width: 100%;
            max-width: 400px;

            background: white;

            border-radius: 30px;

            padding: 35px 25px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            animation: aparecer 0.3s ease;
        }

        .result-box .emoji {
            font-size: 65px;
            margin-bottom: 10px;
        }

        .result-box h2 {
            color: #e95b9f;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .result-box p {
            color: #8d7183;
            margin-bottom: 20px;
        }

        .result-info {
            background: #fff0f8;

            border-radius: 12px;

            padding: 10px;

            margin: 8px 0;
        }

        .result-info strong {
            color: #e95b9f;
        }

        .play-again {
            border: none;

            padding: 14px 24px;

            border-radius: 15px;

            background: linear-gradient(
                135deg,
                #ff70b2,
                #b78aff
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 15px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* CELULAR */

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            .board {
                gap: 7px;
            }

            .card-front,
            .card-back {
                border-radius: 12px;
            }

            .info-box {
                font-size: 12px;
            }

            .info-box strong {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <main class="game">

        <h1>🧠 Jogo da Memória</h1>

        <p class="subtitle">
            Encontre todos os pares! 💕
        </p>

        <div class="info">

            <div class="info-box">
                ⭐ Pontos
                <strong id="score">0</strong>
            </div>

            <div class="info-box">
                🎯 Tentativas
                <strong id="attempts">0</strong>
            </div>

            <div class="info-box">
                ⏱️ Tempo
                <strong id="time">60</strong>
            </div>

        </div>

        <div
            id="board"
            class="board"
        ></div>

        <button
            id="restart"
            class="restart"
        >
            🔄 Jogar novamente
        </button>

    </main>


    <!-- TELA DE RESULTADO -->

    <div
        id="overlay"
        class="overlay hidden"
    >

        <div class="result-box">

            <div
                id="resultEmoji"
                class="emoji"
            >
                🏆
            </div>

            <h2 id="resultTitle">
                Parabéns!
            </h2>

            <p id="resultMessage">
                Você encontrou todos os pares!
            </p>

            <div class="result-info">
                ⭐ Pontos:
                <strong id="finalScore">0</strong>
            </div>

            <div class="result-info">
                🎯 Tentativas:
                <strong id="finalAttempts">0</strong>
            </div>

            <div class="result-info">
                ⏱️ Tempo:
                <strong id="finalTime">0</strong>s
            </div>

            <button
                id="playAgain"
                class="play-again"
            >
                🎀 Jogar novamente
            </button>

        </div>

    </div>


    <script>

        // =====================================
        // ELEMENTOS
        // =====================================

        const board =
            document.getElementById("board");

        const scoreElement =
            document.getElementById("score");

        const attemptsElement =
            document.getElementById("attempts");

        const timeElement =
            document.getElementById("time");

        const restartButton =
            document.getElementById("restart");

        const playAgainButton =
            document.getElementById("playAgain");

        const overlay =
            document.getElementById("overlay");

        const resultTitle =
            document.getElementById("resultTitle");

        const resultMessage =
            document.getElementById("resultMessage");

        const resultEmoji =
            document.getElementById("resultEmoji");

        const finalScore =
            document.getElementById("finalScore");

        const finalAttempts =
            document.getElementById("finalAttempts");

        const finalTime =
            document.getElementById("finalTime");


        // =====================================
        // EMOJIS
        // =====================================

        const symbols = [
            "🐱",
            "🐶",
            "🐰",
            "🦄",
            "🍓",
            "🧁",
            "🌸",
            "💎"
        ];


        // =====================================
        // VARIÁVEIS
        // =====================================

        let firstCard = null;

        let secondCard = null;

        let lockBoard = false;

        let matches = 0;

        let score = 0;

        let attempts = 0;

        let time = 60;

        let timer = null;


        // =====================================
        // EMBARALHAR
        // =====================================

        function shuffle(array) {

            for (
                let i = array.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [
                    array[i],
                    array[j]
                ] = [
                    array[j],
                    array[i]
                ];
            }

        }


        // =====================================
        // COMEÇAR JOGO
        // =====================================

        function startGame() {

            clearInterval(timer);

            firstCard = null;
            secondCard = null;

            lockBoard = false;

            matches = 0;
            score = 0;
            attempts = 0;
            time = 60;

            updateInfo();

            overlay.classList.add("hidden");

            board.innerHTML = "";


            // Criar pares

            let cards = [
                ...symbols,
                ...symbols
            ];


            // Embaralhar

            shuffle(cards);


            // Criar cartas

            cards.forEach(
                symbol => {

                    createCard(symbol);

                }
            );


            // Começar cronômetro

            startTimer();

        }


        // =====================================
        // CRIAR CARTA
        // =====================================

        function createCard(symbol) {

            const card =
                document.createElement("button");

            card.className = "card";

            card.dataset.symbol = symbol;


            card.innerHTML = `
                <div class="card-inner">

                    <div class="card-back"></div>

                    <div class="card-front">
                        ${symbol}
                    </div>

                </div>
            `;


            card.addEventListener(
                "click",
                () => flipCard(card)
            );


            board.appendChild(card);

        }


        // =====================================
        // VIRAR CARTA
        // =====================================

        function flipCard(card) {

            if (lockBoard) {
                return;
            }


            if (card === firstCard) {
                return;
            }


            if (card.classList.contains("matched")) {
                return;
            }


            card.classList.add("flipped");


            if (firstCard === null) {

                firstCard = card;

                return;
            }


            secondCard = card;

            attempts++;

            updateInfo();

            checkCards();

        }


        // =====================================
        // VERIFICAR CARTAS
        // =====================================

        function checkCards() {

            const match =
                firstCard.dataset.symbol ===
                secondCard.dataset.symbol;


            if (match) {

                correctPair();

            } else {

                wrongPair();

            }

        }


        // =====================================
        // PAR CORRETO
        // =====================================

        function correctPair() {

            firstCard.classList.add("matched");

            secondCard.classList.add("matched");


            matches++;

            score += 100;


            updateInfo();


            resetCards();


            // Todos os pares encontrados?

            if (
                matches === symbols.length
            ) {

                winGame();

            }

        }


        // =====================================
        // PAR ERRADO
        // =====================================

        function wrongPair() {

            lockBoard = true;


            setTimeout(
                () => {

                    firstCard.classList.remove(
                        "flipped"
                    );

                    secondCard.classList.remove(
                        "flipped"
                    );


                    resetCards();

                },
                800
            );

        }


        // =====================================
        // RESETAR
        // =====================================

        function resetCards() {

            firstCard = null;

            secondCard = null;

            lockBoard = false;

        }


        // =====================================
        // CRONÔMETRO
        // =====================================

        function startTimer() {

            timer =
                setInterval(
                    () => {

                        time--;

                        updateInfo();


                        if (time <= 0) {

                            clearInterval(timer);

                            loseGame();

                        }

                    },
                    1000
                );

        }


        // =====================================
        // VITÓRIA
        // =====================================

        function winGame() {

            clearInterval(timer);

            // Bônus pelo tempo

            score += time * 5;

            updateInfo();


            resultEmoji.textContent = "🏆";

            resultTitle.textContent =
                "Parabéns! 💖";

            resultMessage.textContent =
                "Você encontrou todos os pares!";


            finalScore.textContent =
                score;

            finalAttempts.textContent =
                attempts;

            finalTime.textContent =
                60 - time;


            overlay.classList.remove(
                "hidden"
            );

        }


        // =====================================
        // PERDEU
        // =====================================

        function loseGame() {

            lockBoard = true;


            resultEmoji.textContent = "⏰";

            resultTitle.textContent =
                "Tempo acabou!";

            resultMessage.textContent =
                "Tente novamente! Você consegue! 💕";


            finalScore.textContent =
                score;

            finalAttempts.textContent =
                attempts;

            finalTime.textContent =
                60;


            overlay.classList.remove(
                "hidden"
            );

        }


        // =====================================
        // ATUALIZAR INFORMAÇÕES
        // =====================================

        function updateInfo() {

            scoreElement.textContent =
                score;

            attemptsElement.textContent =
                attempts;

            timeElement.textContent =
                time;

        }


        // =====================================
        // BOTÕES
        // =====================================

        restartButton.addEventListener(
            "click",
            startGame
        );

        playAgainButton.addEventListener(
            "click",
            startGame
        );


        // =====================================
        // INICIAR
        // =====================================

        startGame();

    </script>

</body>
</html>
